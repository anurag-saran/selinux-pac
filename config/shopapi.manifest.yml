# shopapi — Spring Boot demo reference (generation pipeline)
#
# Paths and port come from systemd EnvironmentFile written from
# config/shopapi.manifest.yml. Do not add literals here for the demo host.

app_name: shopapi
domain: shopapi_t

paths:
  install_root: /opt/shopapi
  var_dir: /var/lib/shopapi
  log_dir: /var/log/shopapi
  runtime_dir: /run/shopapi
  # Outage path. Not in the types-only .fc; generate adds it from /feature-spool AVCs.
  extra_fc_roots:
    - /var/spool/shopapi

services:
  primary:
    unit: shopapi.service
    domain: shopapi_t

http:
  host: 127.0.0.1
  port: 8091
  endpoints:
    - /health
    - /state
    - /log

selinux_ports:
  - port: 8091
    proto: tcp
    type: shopapi_port_t

policy:
  module_dir: selinux/shopapi
  service_name: shopapi.service

deploy:
  soak_marker_file: /var/lib/selinux-policy-ops/shopapi/selinux_canary_deployed_at
  deploy_report_file: /var/lib/selinux-policy-ops/shopapi/selinux_deploy_report.json
