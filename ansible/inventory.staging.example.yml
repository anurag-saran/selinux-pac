# Copy to ansible/inventory.staging.yml when Ansible runs *on* the staging host
# (ansible_connection: local). Two-host SSH from a laptop: use inventory.dev.yml
# (see inventory.dev.example.yml and scripts/setup_rhel_hosts.sh).

all:
  hosts:
    staging-host:
      ansible_connection: local
      ansible_become: true
  vars:
    app_name: myapp
    domain: myapp_t
    install_root: /opt/myapp
    var_dir: /var/lib/myapp
    log_dir: /var/log/myapp
    runtime_dir: /run/myapp
    service_name: myapp.service
    selinux_ops_from_package: false
    selinux_ops_dir: "{{ playbook_dir }}/../scripts"
    policy_artifact_dir: "{{ playbook_dir }}/.."
    policy_pp_src: "{{ policy_artifact_dir }}/selinux/{{ app_name }}.pp"
    app_manifest_path: >-
      {{
        (policy_artifact_dir | dirname) ~ '/config/' ~ app_name ~ '.manifest.yml'
        if (policy_artifact_dir | basename) == 'policy_out'
        else policy_artifact_dir ~ '/config/' ~ app_name ~ '.manifest.yml'
      }}
    ansible_env_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    soak_marker_file: "/var/lib/selinux-policy-ops/{{ app_name }}/selinux_canary_deployed_at"
    soak_min_days: 7
    soak_max_avc: 0
    soak_max_net_new: 0
    soak_use_net_new: true
