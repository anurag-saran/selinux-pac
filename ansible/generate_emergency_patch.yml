---
# Controller + git checkout only. Writes policy_out/ for a PR. Never install
# on a host (no semodule -i). Copy AVCs here after rollback or soak-fail.
- name: Generate emergency policy patch from AVC log (controller)
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    policy_artifact_dir: "{{ playbook_dir }}/.."
    emergency_log: "{{ emergency_avc_log | default('/tmp/emergency_avc.log') }}"
    manifest: "{{ policy_artifact_dir }}/config/{{ app_name | default('myapp') }}.manifest.yml"
  tasks:
    - name: Require git policy sources on this checkout
      ansible.builtin.stat:
        path: "{{ policy_artifact_dir }}/selinux/{{ app_name | default('myapp') }}.te"
      register: emergency_te_stat

    - name: Fail when this is not a policy git checkout
      ansible.builtin.fail:
        msg: >-
          generate_emergency_patch.yml is controller-only. It writes policy_out/
          for a PR. Do not run it on production hosts and do not semodule -i
          the result. Copy /tmp/emergency_avc.log or selinux_soak_last_fail.avc
          onto this checkout (see docs/admin/401-OPERATIONS.md#a-denial-after-ship).
      when: not emergency_te_stat.stat.exists

    - name: Require emergency AVC log
      ansible.builtin.stat:
        path: "{{ emergency_log }}"
      register: emergency_avc_stat

    - name: Fail when emergency log missing
      ansible.builtin.fail:
        msg: "Export AVCs first: ausearch … > {{ emergency_log }}"
      when: not emergency_avc_stat.stat.exists

    - name: Generate policy patch from the AVC log
      ansible.builtin.command: >
        python3 {{ policy_artifact_dir }}/cli/deterministic_gen.py
        --avc-log {{ emergency_log }}
        --manifest {{ manifest }}
        --existing-te {{ policy_artifact_dir }}/selinux/{{ app_name | default('myapp') }}.te
        --existing-fc {{ policy_artifact_dir }}/selinux/{{ app_name | default('myapp') }}.fc
        --out-dir {{ policy_artifact_dir }}/policy_out
        --bump-version
      register: det_gen
      changed_when: det_gen.rc == 0

    - name: Validate forbidden patterns on candidate
      ansible.builtin.command: >
        bash {{ policy_artifact_dir }}/scripts/validate_forbidden_patterns.sh
        {{ policy_artifact_dir }}/policy_out

    - name: Next step is a PR not a host install
      ansible.builtin.debug:
        msg: >-
          policy_out/ updated via deterministic_gen. Review, run
          bash scripts/assemble_pr_body.sh, open a PR, then AAP Release canary.
          Do not semodule -i this output on prod.
